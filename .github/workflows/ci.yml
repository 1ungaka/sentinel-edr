name: ci

# One workflow, six validation lanes. Every gate in this repository is already a make target
# in the Makefile; the workflow only decides which lane runs what, how long it
# may take and what gets published. The lanes share a checkout and a composite
# action, not a job: a red `test` can never mask a green `detection gates`, and
# every failure has a name a reviewer can assign instead of a line in one
# 20-minute log.
#
# The release is not here: it lives in release.yml, which waits for this
# workflow's run of the same commit before it publishes anything. A release that
# did not wait would publish a tree whose gates had not run.

on:
  pull_request:
    # Prose and completion-only changes cannot move the engine gates. Scripts
    # and packaging do affect the release and run its wiring regression checks.
    # Main pushes and tags are never path-filtered: they are the integration gate and release trigger,
    # and a tag whose head commit is a docs change must still cut a release.
    paths-ignore:
      - "**.md"
      - "wiki/**"
      - "docs/**"
      - "completions/**"
      - "debian/**"
      - ".github/dependabot.yml"
      - ".github/workflows/wiki.yml"
  push:
    branches: [main, beta]
    tags: ["v*"]
  # A CGO build against a moving runner image (Go, libyara, glibc) is the one
  # thing a push-only pipeline never exercises. The nightly run is the drift
  # canary, and nothing else needs the GH runner image to stay honest.
  schedule:
    - cron: "27 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A superseded PR run is worthless; a run of main, or of a release tag, is not.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint, vet, vendor tree
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/cau-env

      - name: gofmt, go vet and pipeline regressions
        run: make lint

      # The regex sweep for bug shapes (swallowed errors, unbounded
      # allocations, broken conditions). It is a gate: a hit that is not in
      # scripts/regex-audit.baseline fails the job, because a baseline entry
      # stands for a hit somebody read and marked. The script needs only the
      # standard library, and the runner image ships python3 — the step says
      # so out loud rather than failing on a missing interpreter.
      - name: Regex sweep for bug shapes
        run: |
          python3 --version
          make regex-audit

      - name: Validate GitHub workflows and shell commands
        run: |
          docker run --rm -v "$PWD:/repo:ro" --workdir /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

      # Debian and Arch build offline out of the committed vendor/ tree
      # (debian/rules: GOPROXY=off), so a stale vendor/ breaks packaging rather
      # than this pipeline. Catch it here, where it costs seconds.
      - name: vendor/ matches go.mod
        run: |
          go mod vendor
          if ! git diff --exit-code -- vendor; then
            echo "::error::vendor/ is stale: run 'go mod vendor' and commit the result"
            exit 1
          fi

  test:
    name: unit tests (race)
    runs-on: ubuntu-24.04
    # TestMeasureRealELF walks ~5k system files on an Ubuntu runner and the
    # Makefile gives the suite a 25-minute budget; the job has to be able to
    # reach that budget or a slow runner fails a green tree.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/cau-env

      - name: Race tests over every package
        run: make test-race

  gates:
    name: detection gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/cau-env

      - name: Build both binaries
        run: make build build-mcp

      - name: Rule lint
        run: make lint-rules

      - name: ATT&CK coverage gate and matrix
        run: |
          set -o pipefail
          make coverage | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Corpus validation and regression gate
        run: |
          set -o pipefail
          make eval | tee -a "$GITHUB_STEP_SUMMARY"

      # The temporal gate is its own step because it is its own question: not
      # "did this change regress" but "does the content still catch what it
      # caught in an earlier period of the corpus". `make eval` runs it too;
      # it is named here so a failure says which gate failed.
      - name: Temporal generalization gate
        run: |
          set -o pipefail
          make temporal-gate | tee -a "$GITHUB_STEP_SUMMARY"

      # Published even when a gate above failed: the report is the evidence for
      # the failure, so a reviewer should never have to re-run the job to get it.
      - name: Publish the gate reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: eval-and-coverage
          path: |
            eval-out/report.json
            eval-out/attack-navigator.json
            eval-out/attack-coverage.sarif

  selfscan:
    name: self-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      # The recipe docs/cli.md documents ("CI recipes") but never wired up: the
      # SARIF this project produces for other people lands in its own
      # code-scanning dashboard, so a rule or heuristic that starts firing on
      # the tree is a review item instead of an artifact nobody opens.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/cau-env

      - name: Build
        run: make build

      - name: Scan the repository with itself (SARIF and OCSF)
        run: |
          ./cau scan --dir . --format sarif --output cau.sarif --fail-on none --quiet
          ./cau scan --dir . --format ocsf --output cau.ocsf.json --fail-on none --quiet

      - name: Upload the SARIF to code scanning
        # The guard matters: if the scan step died there is no SARIF to upload,
        # and code scanning keeps the last good set rather than being wiped.
        if: always() && hashFiles('cau.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: cau.sarif
          category: cau-self-scan

      - name: Publish the self-scan reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: self-scan
          path: |
            cau.sarif
            cau.ocsf.json

  fuzz:
    name: fuzz the untrusted-input parsers
    runs-on: ubuntu-24.04
    # Two budgets, one job. A push or pull request gets the smoke hunt (30s per
    # target, about 15 minutes in all). The nightly schedule gets the campaign:
    # 4 minutes per target across the Makefile's Fuzz* targets, which is where
    # a deep parser state is actually reached, and it costs no reviewer any
    # waiting because nothing is waiting on a scheduled run.
    timeout-minutes: ${{ github.event_name == 'schedule' && 180 || 30 }}
    env:
      FUZZTIME: ${{ github.event_name == 'schedule' && '4m' || '30s' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/cau-env

      - name: Build
        run: make build

      # Every seed corpus already runs as a unit test in the race lane, so the
      # value here is coverage-guided mutation on top of them: 30s per target
      # catches a freshly-introduced nil deref, the nightly budget hunts, and
      # a crasher either finds is exactly the "commit the seed under
      # testdata/fuzz/, fix before merge" case docs/contributing.md describes.
      # The job only reads the repository, so the crasher is published as an
      # artifact for a human to commit; a red nightly run is the alert.
      - name: Coverage-guided hunt over every Fuzz* target
        run: make fuzz FUZZTIME="$FUZZTIME"

      - name: Publish the crasher it found
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fuzz-crashers
          path: |
            **/testdata/fuzz/**

  reproducible:
    name: reproducible build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/cau-env

      # The Makefile claims the build is reproducible (-trimpath, a version
      # taken from the tag). This lane holds it to that: the same checkout,
      # copied to two directories of different depth and built independently,
      # must produce byte-identical binaries. A difference means a build path,
      # a timestamp or an unordered input has leaked into the artifact, and a
      # release whose bytes a second builder cannot reproduce cannot be
      # audited against its source.
      - name: Same source, two directories, identical binaries
        run: |
          set -euo pipefail
          a="$RUNNER_TEMP/build-a/cau"
          b="$RUNNER_TEMP/build-b/some/other/depth/cau"
          mkdir -p "$a" "$b"
          cp -a . "$a/"
          cp -a . "$b/"
          for d in "$a" "$b"; do
            (cd "$d" && make build build-mcp VERSION=repro-check)
          done
          (cd "$a" && sha256sum cau cau-mcp) > "$RUNNER_TEMP/a.sum"
          (cd "$b" && sha256sum cau cau-mcp) > "$RUNNER_TEMP/b.sum"
          cat "$RUNNER_TEMP/a.sum"
          if ! diff "$RUNNER_TEMP/a.sum" "$RUNNER_TEMP/b.sum"; then
            echo "::error::the two builds differ: the build is not reproducible"
            exit 1
          fi
