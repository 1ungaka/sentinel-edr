name: ci

# One workflow, six lanes. Every gate in this repository is already a make target
# in the Makefile; the workflow only decides which lane runs what, how long it
# may take and what gets published. The lanes share a checkout and a composite
# action, not a job: a red `test` can never mask a green `detection gates`, and
# every failure has a name a reviewer can assign instead of a line in one
# 20-minute log.

on:
  pull_request:
    # Documentation, wiki, packaging and completion-only changes cannot move any
    # gate in this workflow, so they get no runner time. main pushes and tags are
    # never path-filtered: they are the integration gate and the release trigger,
    # and a tag whose head commit is a docs change must still cut a release.
    paths-ignore:
      - "**.md"
      - "wiki/**"
      - "docs/**"
      - "completions/**"
      - "packaging/**"
      - "scripts/**"
      - "debian/**"
      - ".github/dependabot.yml"
      - ".github/workflows/wiki.yml"
      - ".github/workflows/package.yml"
  push:
    branches: [main]
    tags: ["v*"]
  # A CGO build against a moving runner image (Go, libyara, glibc) is the one
  # thing a push-only pipeline never exercises. The nightly run is the drift
  # canary, and nothing else needs the GH runner image to stay honest.
  schedule:
    - cron: "27 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A superseded PR run is worthless; a run of main, or of a release tag, is not.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint, vet, vendor tree
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ./.github/actions/cau-env

      - name: gofmt and go vet
        run: make lint

      # Debian and Arch build offline out of the committed vendor/ tree
      # (debian/rules: GOPROXY=off), so a stale vendor/ breaks packaging rather
      # than this pipeline. Catch it here, where it costs seconds.
      - name: vendor/ matches go.mod
        run: |
          go mod vendor
          if ! git diff --exit-code -- vendor; then
            echo "::error::vendor/ is stale: run 'go mod vendor' and commit the result"
            exit 1
          fi

  test:
    name: unit tests (race)
    runs-on: ubuntu-latest
    # TestMeasureRealELF walks ~5k system files on an Ubuntu runner and the
    # Makefile gives the suite a 25-minute budget; the job has to be able to
    # reach that budget or a slow runner fails a green tree.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ./.github/actions/cau-env

      - name: Race tests over every package
        run: make test-race

  gates:
    name: detection gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ./.github/actions/cau-env

      - name: Build both binaries
        run: make build build-mcp

      - name: Rule lint
        run: make lint-rules

      - name: ATT&CK coverage gate and matrix
        run: |
          set -o pipefail
          make coverage | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Corpus validation and regression gate
        run: |
          set -o pipefail
          make eval | tee -a "$GITHUB_STEP_SUMMARY"

      # Published even when a gate above failed: the report is the evidence for
      # the failure, so a reviewer should never have to re-run the job to get it.
      - name: Publish the gate reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eval-and-coverage
          path: |
            eval-out/report.json
            eval-out/attack-navigator.json
            eval-out/attack-coverage.sarif

  selfscan:
    name: self-scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # The recipe docs/cli.md documents ("CI recipes") but never wired up: the
      # SARIF this project produces for other people lands in its own
      # code-scanning dashboard, so a rule or heuristic that starts firing on
      # the tree is a review item instead of an artifact nobody opens.
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ./.github/actions/cau-env

      - name: Build
        run: make build

      - name: Scan the repository with itself (SARIF and OCSF)
        run: |
          ./cau scan --dir . --format sarif --output cau.sarif --fail-on none --quiet
          ./cau scan --dir . --format ocsf --output cau.ocsf.json --fail-on none --quiet

      - name: Upload the SARIF to code scanning
        # The guard matters: if the scan step died there is no SARIF to upload,
        # and code scanning keeps the last good set rather than being wiped.
        if: always() && hashFiles('cau.sarif') != ''
        uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          sarif_file: cau.sarif
          category: cau-self-scan

      - name: Publish the self-scan reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: self-scan
          path: |
            cau.sarif
            cau.ocsf.json

  fuzz:
    name: fuzz the untrusted-input parsers
    runs-on: ubuntu-latest
    # Two budgets, one job. A push or pull request gets the smoke hunt (30s per
    # target, about 15 minutes in all). The nightly schedule gets the campaign:
    # 4 minutes per target across the Makefile's Fuzz* targets, which is where
    # a deep parser state is actually reached, and it costs no reviewer any
    # waiting because nothing is waiting on a scheduled run.
    timeout-minutes: ${{ github.event_name == 'schedule' && 180 || 30 }}
    env:
      FUZZTIME: ${{ github.event_name == 'schedule' && '4m' || '30s' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ./.github/actions/cau-env

      - name: Build
        run: make build

      # Every seed corpus already runs as a unit test in the race lane, so the
      # value here is coverage-guided mutation on top of them: 30s per target
      # catches a freshly-introduced nil deref, the nightly budget hunts, and
      # a crasher either finds is exactly the "commit the seed under
      # testdata/fuzz/, fix before merge" case docs/contributing.md describes.
      # The job only reads the repository, so the crasher is published as an
      # artifact for a human to commit; a red nightly run is the alert.
      - name: Coverage-guided hunt over every Fuzz* target
        run: make fuzz FUZZTIME="$FUZZTIME"

      - name: Publish the crasher it found
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-crashers
          path: |
            **/testdata/fuzz/**

  reproducible:
    name: reproducible build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ./.github/actions/cau-env

      # The Makefile claims the build is reproducible (-trimpath, a version
      # taken from the tag). This lane holds it to that: the same checkout,
      # copied to two directories of different depth and built independently,
      # must produce byte-identical binaries. A difference means a build path,
      # a timestamp or an unordered input has leaked into the artifact, and a
      # release whose bytes a second builder cannot reproduce cannot be
      # audited against its source.
      - name: Same source, two directories, identical binaries
        run: |
          set -euo pipefail
          a="$RUNNER_TEMP/build-a/cau"
          b="$RUNNER_TEMP/build-b/some/other/depth/cau"
          mkdir -p "$a" "$b"
          cp -a . "$a/"
          cp -a . "$b/"
          for d in "$a" "$b"; do
            (cd "$d" && make build build-mcp VERSION=repro-check)
          done
          (cd "$a" && sha256sum cau cau-mcp) > "$RUNNER_TEMP/a.sum"
          (cd "$b" && sha256sum cau cau-mcp) > "$RUNNER_TEMP/b.sum"
          cat "$RUNNER_TEMP/a.sum"
          if ! diff "$RUNNER_TEMP/a.sum" "$RUNNER_TEMP/b.sum"; then
            echo "::error::the two builds differ: the build is not reproducible"
            exit 1
          fi

  release:
    name: build and sign release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test, gates, selfscan, fuzz, reproducible]
    runs-on: ubuntu-latest
    # Longer than a gate job: this job waits for the package workflow's run to
    # finish before it signs, because the distro packages it covers are built
    # there, and that run may still be in its last leg when this job starts.
    timeout-minutes: 45
    permissions:
      contents: write
      # The distro packages are staged in from that workflow's artifacts, and
      # the GITHUB_TOKEN can read another run's artifacts with nothing less.
      actions: read
    env:
      # Hex-encoded Ed25519 signing key (seed or full). Set this repository
      # secret to produce signed releases; without it the release is published
      # unsigned (and `cau verify-self` / `cau update` have nothing to trust).
      CAU_RELEASE_SIGNING_KEY: ${{ secrets.CAU_RELEASE_SIGNING_KEY }}
      # The matching Ed25519 public key (hex), a repository variable or secret.
      # Published as a release asset and used to self-verify before publishing.
      CAU_RELEASE_PUBLIC_KEY: ${{ vars.CAU_RELEASE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ./.github/actions/cau-env

      - name: Build the release tarballs
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          make build VERSION="$tag"
          # cau-mcp ships with every package (Debian, Arch, make install) and was
          # the only artifact the release job never built.
          make build-mcp VERSION="$tag"
          mkdir -p dist
          for art in cau cau-mcp; do
            cp "$art" "dist/${art}-${tag}-linux-amd64"
            tar -czf "dist/${art}-${tag}-linux-amd64.tar.gz" "$art" rules signatures LICENSE README.md
            # A CycloneDX SBOM per binary, read from the build information the
            # linker embedded in that binary: the modules actually linked, not
            # a manifest that might differ. It has no timestamp or serial, so
            # it is reproducible, and it lands in dist/ before SHA256SUMS is
            # signed, so the SBOM is covered by the release signature.
            ./cau bundle sbom --binary "$art" --output "dist/${art}-${tag}-linux-amd64.cdx.json"
          done
          # The source tarball, and why it is built here rather than linked.
          # GitHub's /archive/ tarballs are generated per request and are not
          # byte-stable, so a sha256 recorded from one fetch does not match the
          # bytes a packager downloads next (this is what broke the Arch build:
          # makepkg's source validation failed on a URL the tree had not
          # changed). This asset is fixed bytes, so the PKGBUILD, the Debian
          # orig tarball and `uscan` can all pin it.
          #
          # Determinism is built in three steps, and all three are load-bearing:
          #   1. What is excluded is chosen by pathspec, not by
          #      .gitattributes export-ignore. export-ignore looks right and is
          #      the wrong tool: GitHub's codeload archive — which
          #      actions/checkout downloads instead of cloning — applies it, so
          #      marking debian/ export-ignore silently deleted debian/,
          #      packaging/ and .github/ from every CI checkout and three jobs
          #      died on a missing debian/changelog.
          #      What comes out: packaging/arch/ (the PKGBUILD that hashes this
          #      tarball, so it cannot be inside it), debian/ and .github/.
          #      What stays: packaging/systemd/, because the PKGBUILD installs
          #      the units out of the source tree, and excluding the whole
          #      tree breaks `make install-systemd` for Arch users.
          #   2. tar restamps every member to a FIXED epoch. Using the tag's
          #      commit date here would look natural and would be wrong: it
          #      makes the bytes change on every new commit, and the recorded
          #      checksum would only match the tree at the instant it was
          #      taken. A constant makes the checksum a function of content
          #      alone, which is what a packager needs to pin.
          #   3. --sort=name, owner/group 0 and gzip -n remove the remaining
          #      per-run variation (name order, usernames, gzip timestamp).
          # Verified locally: two runs produce one checksum, and the checksum is
          # unchanged by a commit that only touches packaging/.
          SOURCE_DATE_EPOCH=1735689600
          v=${tag#v}
          stage=$(mktemp -d)
          git archive --format=tar --prefix="cau-${v}/" "$tag" -- . \
            ':(exclude)packaging/arch' ':(exclude)debian' ':(exclude).github' |
            tar -x -C "$stage"
          tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" --owner=0 --group=0 \
            --numeric-owner --format=gnu -C "$stage" -cf - "cau-${v}" |
            gzip -9n > "dist/cau-${v}.tar.gz"
          rm -rf "$stage"
          ls -l dist

      - name: Stage the distro packages before signing
        env:
          # gh authenticates from this variable, and reading the package run's
          # artifacts needs the actions: read granted for this job above.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The .deb and .pkg.tar.zst assets are built by the package workflow,
          # in distro containers this job cannot enter. They used to reach the
          # release after SHA256SUMS was signed, so the one file a user is told
          # to trust did not cover the packages they are told to download. They
          # are pulled in here instead, ahead of the signing step below, so the
          # signed manifest authenticates every asset the release offers.
          #
          # Waiting for that run is the contract, not an optimisation: the
          # signing step hashes what is in dist/, a package staged after it
          # would ship unsigned, and a packaging leg that failed to build must
          # fail the release rather than leave a hole in the manifest.
          #
          # Both workflows trigger on the same push, so the package run exists
          # by now; the short retry only absorbs a slow run creation.
          run_id=""
          for _ in 1 2 3 4 5; do
            run_id=$(gh run list -w package.yml -e push -c "$GITHUB_SHA" \
              --json databaseId,createdAt \
              --jq 'sort_by(.createdAt) | last | .databaseId // empty')
            [ -n "$run_id" ] && break
            sleep 15
          done
          if [ -z "$run_id" ]; then
            echo "::error::no package workflow run for $GITHUB_SHA: the distro packages cannot be staged into the signed manifest"
            exit 1
          fi
          echo "waiting for the package workflow run $run_id to finish"
          if ! gh run watch "$run_id" --exit-status --interval 30; then
            echo "::error::the package workflow run $run_id did not succeed: a distro package is missing, so the release would ship an unauthenticated one"
            exit 1
          fi
          stage=$(mktemp -d)
          trap 'rm -rf "$stage"' EXIT
          # gh extracts each artifact under its own name, so the six legs do
          # not collide on the way in.
          gh run download "$run_id" --dir "$stage"
          mkdir -p dist
          # Sorted, so the move order is deterministic: the Debian and Kali legs
          # build the same filename for the same architecture, and the release
          # publishes exactly the bytes that land in dist/ (and so sign them).
          # Only the packages the installation guide names move; the source
          # package and its build metadata stay in the workflow artifact.
          find "$stage" -type f \( -name '*.deb' -o -name '*.pkg.tar.zst' \) \
            | sort | while IFS= read -r f; do
                mv "$f" "dist/$(basename "$f")"
              done
          # Every leg of the matrix delivered, or nothing ships: a manifest
          # with a package-sized hole in it is the bug this staging replaces.
          shopt -s nullglob
          missing=0
          for pat in 'cau_*_amd64.deb' 'cau_*_arm64.deb' \
                     'cau-*-x86_64.pkg.tar.zst' 'cau-*-aarch64.pkg.tar.zst'; do
            hits=(dist/$pat)
            if [ "${#hits[@]}" -eq 0 ]; then
              echo "::error::the release has no staged package matching dist/$pat"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::not every distro package reached dist/: refusing to sign a manifest that does not cover them"
            exit 1
          fi
          ls -l dist/

      - name: Sign the update bundle, the integrity baseline and the checksums
        run: |
          set -euo pipefail
          if [ -z "$CAU_RELEASE_SIGNING_KEY" ]; then
            echo "::warning::CAU_RELEASE_SIGNING_KEY is not set; publishing an UNSIGNED release"
            (cd dist && sha256sum * > SHA256SUMS)
            exit 0
          fi
          # Write the key to a private temp file, sign, then shred it.
          umask 077
          KEYFILE="$(mktemp)"
          printf '%s' "$CAU_RELEASE_SIGNING_KEY" > "$KEYFILE"
          trap 'shred -u "$KEYFILE" 2>/dev/null || rm -f "$KEYFILE"' EXIT
          tag="${GITHUB_REF_NAME}"

          # 1) Signed signature-DB bundle, for `cau update`.
          ./cau bundle update --db signatures/hashes.txt --sign-key "$KEYFILE" \
            --out dist --db-version "$tag" --min-engine "${tag#v}"

          # 2) Signed detection-content integrity baseline (`cau selftest`).
          ./cau selftest --record --sign-key "$KEYFILE" --manifest dist/integrity.json

          # 3) The pinned public key, so `cau verify-self` has something to check
          #    against on a machine that holds no repository secret.
          if [ -n "$CAU_RELEASE_PUBLIC_KEY" ]; then
            printf '%s' "$CAU_RELEASE_PUBLIC_KEY" > dist/release-pubkey.hex
          else
            echo "::warning::CAU_RELEASE_PUBLIC_KEY is not set; the release will not self-verify before publishing"
          fi

          # 4) Signed SHA256SUMS over everything now in dist/ — the tarballs,
          #    both binaries, the bundle, the integrity manifest and the distro
          #    packages staged above. Order is the contract: a file staged after
          #    this line ships unsigned, which is how the integrity manifest and
          #    the public key used to ship.
          #    The binary thereby references itself: its own hash is in a file it
          #    can fetch and verify against the pinned key.
          ./cau bundle checksums --sign-key "$KEYFILE" --out dist \
            $(find dist -maxdepth 1 -type f ! -name 'SHA256SUMS*')

      - name: Verify the signed artifacts before publishing
        if: env.CAU_RELEASE_SIGNING_KEY != '' && env.CAU_RELEASE_PUBLIC_KEY != ''
        run: |
          # A release that cannot verify itself must not ship: the built binary
          # computes its own SHA-256 and checks it against the signed
          # SHA256SUMS above, signature before hash.
          ./cau verify-self --from dist --pubkey dist/release-pubkey.hex \
            --name "cau-${GITHUB_REF_NAME}-linux-amd64"

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          # dist/ in full, the distro packages included: they were staged from
          # the package workflow before signing above, so this one step
          # publishes every asset the signed SHA256SUMS covers.
          files: dist/*
          fail_on_unmatched_files: true
          # v1.2.0-rc1 ships as a pre-release; v1.2.0 does not.
          prerelease: ${{ contains(github.ref_name, '-') }}
