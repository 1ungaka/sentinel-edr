name: cau build environment
description: >-
  The Go toolchain pinned by go.mod plus libyara 4.3+ and pkg-config, which the
  cgo YARA binding requires. Every job in this repository compiles or links
  against libyara (there is no !cgo build), so the environment is one action used
  by all of them instead of one copy of the same apt-get per job.

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        # The current Go, not the version go.mod names. go.mod states the
        # minimum a distribution's toolchain has to satisfy — the Debian and
        # Arch packages build with the distribution's Go — but the build here
        # should carry a fixed standard library: the 1.24 line is past its
        # support window and its net/http has a published vulnerability that
        # was only fixed in 1.26.11. The vulnerability lane says so on every
        # run otherwise.
        go-version: "stable"
        check-latest: true
        cache: true

    - name: Install libyara and pkg-config
      shell: bash
      run: |
        # --no-install-recommends: libyara-dev pulls the runtime shared library,
        # which is what the test binaries link against because the project builds
        # go-yara through its default pkg-config cgo flags. The yara CLI is not
        # installed: YARA runs in-process (docs/installation.md).
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libyara-dev pkg-config
        pkg-config --modversion yara
