name: release

# The release pipeline: one workflow that publishes a main release, a patch
# release and a beta, and that keeps the repository's release metadata in step
# with what it published.
#
# The three kinds differ only in where the version comes from:
#
#   v1.2.0 (a tag)      a main release
#   v1.2.1 (a tag)      a patch release — the same flow, a later tag
#   1.3.0-beta.4        a beta, published from the `beta` branch
#
# Everything after that is the same, which is the point: a beta is a release
# that has not been named yet, and it is built, signed, checksummed and
# published by exactly the steps a tagged release goes through. A beta that
# took a different path would be a beta nobody could trust to become a
# release.
#
# The workflow never invents a version for a tagged release: the tag is the
# version, and the packaging metadata (debian/changelog, the Arch PKGBUILD)
# must already agree with it, or the release fails before anything is built.
# A release whose .deb says 0.2.0 while its tag says v0.2.1 ships a mislabelled
# package, and the signed digest then authenticates the wrong bytes.

on:
  push:
    tags: ["v*"]
    branches: ["beta"]
  workflow_dispatch:
    inputs:
      version:
        description: "the version to publish, without the leading v (0.3.0, 0.3.0-rc1, ...)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A release is not cancelled by a newer one: a half-published release is
  # worse than a late one.
  cancel-in-progress: false

env:
  # Hex-encoded Ed25519 signing key (seed or full). Set this repository
  # secret to produce signed releases; without it the release is published
  # unsigned (and `cau verify-self` / `cau update` have nothing to trust).
  CAU_RELEASE_SIGNING_KEY: ${{ secrets.CAU_RELEASE_SIGNING_KEY }}
  # The matching Ed25519 public key (hex), a repository variable or secret.
  # Published as a release asset and used to self-verify before publishing.
  CAU_RELEASE_PUBLIC_KEY: ${{ vars.CAU_RELEASE_PUBLIC_KEY }}

jobs:
  prepare:
    name: derive the version, check the packaging metadata, wait for the gates
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      # Reading another workflow run's state needs the actions: read scope.
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      from_tag: ${{ steps.version.outputs.from_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        # The version is derived from the tag history, and the Makefile stamps
        # the version from `git describe`, so a shallow checkout would stamp a
        # commit sha instead of the release version.
        with:
          fetch-depth: 0

      - id: version
        name: Work out which release this is
        env:
          # The dispatch input arrives through the environment, never pasted
          # into the script: it is a shell word, and a version that carried
          # one would be a command.
          INPUT_VERSION: ${{ inputs.version }} # audit:ok the input arrives through the environment, never pasted into the script
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
            from_tag=false
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            from_tag=true
          else
            # The beta branch: the last release's version, plus the number of
            # commits since it. The count is a function of the commit, so the
            # same commit always publishes the same beta version — two runs of
            # the same commit are the same beta, not two.
            last=$(git describe --tags --abbrev=0)
            base="${last#v}"
            n=$(git rev-list --count "$last"..HEAD)
            version="${base}-beta.${n}"
            from_tag=false
          fi
          # A version becomes a filename, a release tag and a shell word. Only
          # characters that are safe in all three are allowed.
          case "$version" in
            ''|*[!0-9A-Za-z.+-]*)
              echo "::error::invalid release version: $version"
              exit 1
              ;;
          esac
          prerelease=false
          case "$version" in
            *-*) prerelease=true ;;
          esac
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "prerelease=$prerelease"
            echo "from_tag=$from_tag"
          } >> "$GITHUB_OUTPUT"
          echo "releasing $version (prerelease=$prerelease)"

      # The version the packaging metadata must carry. Debian orders a
      # pre-release before the release with "~" (0.3.0~rc1 sorts before
      # 0.3.0), so the Debian spelling of a pre-release is not the tag's.
      - name: The packaging metadata must agree with the version
        if: steps.version.outputs.from_tag == 'true'
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          debian_version="$version"
          case "$version" in
            *-*) debian_version="${version%%-*}"'~'"${version#*-}" ;;
          esac
          upstream=$(dpkg-parsechangelog -SVersion | sed 's/-[^-]*$//')
          if [ "$upstream" != "$debian_version" ] && [ "$upstream" != "$version" ]; then
            echo "::error::debian/changelog says $upstream but the release is $version"
            exit 1
          fi
          pkgver=$(bash -c '. packaging/arch/PKGBUILD; printf "%s" "$pkgver"')
          if [ "$pkgver" != "$version" ]; then
            echo "::error::packaging/arch/PKGBUILD says $pkgver but the release is $version"
            exit 1
          fi
          echo "the packaging metadata agrees with $version"

      # A release is published from a tree whose gates passed. The gates live
      # in the CI workflow, so this waits for that run the same way the
      # packaging leg is waited for below: both workflows trigger on the same
      # push, so the run exists by now, and the short retry only absorbs a slow
      # run creation.
      #
      # A manual dispatch has no CI run of its own: the tree it publishes is
      # whatever main is, and the gates that ran against main are the ones that
      # apply. Saying so is better than waiting for a run that will never
      # exist.
      - name: Wait for the CI gates of this commit
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          run_id=""
          for _ in 1 2 3 4 5 6 7 8; do
            run_id=$(gh run list -w ci.yml -e push -c "$GITHUB_SHA" \
              --branch "$GITHUB_REF_NAME" --limit 100 \
              --json databaseId,createdAt \
              --jq 'sort_by(.createdAt) | last | .databaseId // empty')
            [ -n "$run_id" ] && break
            sleep 15
          done
          if [ -z "$run_id" ]; then
            echo "::error::no CI run for $GITHUB_SHA: the gates have not run against this commit"
            exit 1
          fi
          echo "waiting for the CI run $run_id to finish"
          if ! gh run watch "$run_id" --exit-status --interval 30; then
            echo "::error::the CI run $run_id did not succeed: the gates are not green for this commit"
            exit 1
          fi

  publish:
    name: build, sign and publish
    needs: prepare
    runs-on: ubuntu-24.04
    # Longer than a gate job: this job waits for the package workflow's run to
    # finish before it signs, because the distro packages it covers are built
    # there, and that run may still be in its last leg when this job starts.
    timeout-minutes: 45
    permissions:
      contents: write
      # The distro packages are staged in from that workflow's artifacts, and
      # the GITHUB_TOKEN can read another run's artifacts with nothing less.
      actions: read
    outputs:
      archive_sha256: ${{ steps.stage.outputs.archive_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/cau-env

      - name: Build the release artifacts
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          version="$VERSION"
          make build VERSION="$version"
          # cau-mcp ships with every package (Debian, Arch, make install) and was
          # the only artifact the release job never built.
          make build-mcp VERSION="$version"
          mkdir -p dist
          for art in cau cau-mcp; do
            cp "$art" "dist/${art}-${version}-linux-amd64"
            tar -czf "dist/${art}-${version}-linux-amd64.tar.gz" "$art" rules signatures LICENSE README.md
            # A CycloneDX SBOM per binary, read from the build information the
            # linker embedded in that binary: the modules actually linked, not
            # a manifest that might differ. It has no timestamp or serial, so
            # it is reproducible, and it lands in dist/ before SHA256SUMS is
            # signed, so the SBOM is covered by the release signature.
            ./cau bundle sbom --binary "$art" --output "dist/${art}-${version}-linux-amd64.cdx.json"
          done
          # Both packaging and release use one deterministic archive recipe.
          # HEAD is the tree being released: the checkout is at the tag, and a
          # beta is released from the branch it was cut on.
          scripts/source-archive.sh "$version" "dist/cau-${version}.tar.gz"
          ls -l dist

      # A tagged release carries the distro packages; a beta does not, because
      # the packaging workflow builds from a tag or from main and a beta is
      # neither. A beta that shipped a .deb would ship one built from a
      # different tree.
      - name: Stage the distro packages before signing
        if: needs.prepare.outputs.from_tag == 'true'
        env:
          # gh authenticates from this variable, and reading the package run's
          # artifacts needs the actions: read granted for this job above.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The .deb and .pkg.tar.zst assets are built by the package workflow,
          # in distro containers this job cannot enter. They used to reach the
          # release after SHA256SUMS was signed, so the one file a user is told
          # to trust did not cover the packages they are told to download. They
          # are pulled in here instead, ahead of the signing step below, so the
          # signed manifest authenticates every asset the release offers.
          #
          # Waiting for that run is the contract, not an optimisation: the
          # signing step hashes what is in dist/, a package staged after it
          # would ship unsigned, and a packaging leg that failed to build must
          # fail the release rather than leave a hole in the manifest.
          #
          # Both workflows trigger on the same push, so the package run exists
          # by now; the short retry only absorbs a slow run creation.
          run_id=""
          for _ in 1 2 3 4 5; do
            run_id=$(gh run list -w package.yml -e push -c "$GITHUB_SHA" \
              --branch "$GITHUB_REF_NAME" --limit 100 \
              --json databaseId,createdAt \
              --jq 'sort_by(.createdAt) | last | .databaseId // empty')
            [ -n "$run_id" ] && break
            sleep 15
          done
          if [ -z "$run_id" ]; then
            echo "::error::no package workflow run for $GITHUB_SHA: the distro packages cannot be staged into the signed manifest"
            exit 1
          fi
          echo "waiting for the package workflow run $run_id to finish"
          if ! gh run watch "$run_id" --exit-status --interval 30; then
            echo "::error::the package workflow run $run_id did not succeed: a distro package is missing, so the release would ship an unauthenticated one"
            exit 1
          fi
          stage=$(mktemp -d)
          trap 'rm -rf "$stage"' EXIT
          # gh extracts each artifact under its own name, so the six legs do
          # not collide on the way in.
          gh run download "$run_id" --dir "$stage"
          mkdir -p dist
          # Assert each distro/architecture artifact individually. Debian and
          # Kali use equal package filenames; staging renames the Kali assets
          # so neither silently overwrites the other before signing.
          scripts/stage-release-packages.sh "$stage" dist
          ls -l dist/

      - id: stage
        name: Remember the source archive's digest
        run: |
          set -euo pipefail
          archive="dist/cau-${{ needs.prepare.outputs.version }}.tar.gz"
          sha=$(sha256sum "$archive" | cut -d ' ' -f 1)
          echo "archive_sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "the source archive's digest is $sha"

      # The release notes are the changelog's own section for this version, so
      # there is one document to keep in step rather than two. GitHub's own
      # generator cannot be used: it looks for "## 1.2.3" headings, and this
      # changelog writes "## [0.3.0] - 2026-11-11", so every release so far
      # carried nothing but a link to the comparison.
      - name: Render the release notes
        env:
          RELEASE_SIGNED: ${{ env.CAU_RELEASE_SIGNING_KEY != '' && '1' || '0' }}
        run: |
          set -euo pipefail
          ./scripts/release-notes.sh "${{ needs.prepare.outputs.version }}" "$RUNNER_TEMP/release-notes.md"
          # The notes are published, so a section that is missing or empty is
          # a failed release: a release that says nothing is worse than one
          # that says little.
          if [ ! -s "$RUNNER_TEMP/release-notes.md" ]; then
            echo "::error::the release notes are empty"
            exit 1
          fi
          head -20 "$RUNNER_TEMP/release-notes.md"

      - name: Sign the update bundle, the integrity baseline and the checksums
        run: |
          set -euo pipefail
          if [ -z "$CAU_RELEASE_SIGNING_KEY" ]; then
            echo "::warning::CAU_RELEASE_SIGNING_KEY is not set; publishing an UNSIGNED release"
            (cd dist && find . -maxdepth 1 -type f ! -name 'SHA256SUMS*' -print0 |
              sort -z | xargs -0 sha256sum > SHA256SUMS)
            exit 0
          fi
          # Write the key to a private temp file, sign, then shred it.
          umask 077
          KEYFILE="$(mktemp)"
          printf '%s' "$CAU_RELEASE_SIGNING_KEY" > "$KEYFILE"
          trap 'shred -u "$KEYFILE" 2>/dev/null || rm -f "$KEYFILE"' EXIT
          version="${{ needs.prepare.outputs.version }}"

          # 1) Signed signature-DB bundle, for `cau update`.
          ./cau bundle update --db signatures/hashes.txt --sign-key "$KEYFILE" \
            --out dist --db-version "$version" --min-engine "$version"

          # 2) Signed detection-content integrity baseline (`cau selftest`).
          ./cau selftest --record --sign-key "$KEYFILE" --manifest dist/integrity.json

          # 3) The pinned public key, so `cau verify-self` has something to check
          #    against on a machine that holds no repository secret.
          if [ -n "$CAU_RELEASE_PUBLIC_KEY" ]; then
            printf '%s' "$CAU_RELEASE_PUBLIC_KEY" > dist/release-pubkey.hex
          else
            echo "::warning::CAU_RELEASE_PUBLIC_KEY is not set; the release will not self-verify before publishing"
          fi

          # 4) Signed SHA256SUMS over everything now in dist/ — the tarballs,
          #    both binaries, the bundle, the integrity manifest and the distro
          #    packages staged above. Order is the contract: a file staged after
          #    this line ships unsigned, which is how the integrity manifest and
          #    the public key used to ship.
          #    The binary thereby references itself: its own hash is in a file it
          #    can fetch and verify against the pinned key.
          mapfile -d '' release_files < <(find dist -maxdepth 1 -type f ! -name 'SHA256SUMS*' -print0 | sort -z)
          ./cau bundle checksums --sign-key "$KEYFILE" --out dist "${release_files[@]}"

      - name: Verify the signed artifacts before publishing
        if: env.CAU_RELEASE_SIGNING_KEY != '' && env.CAU_RELEASE_PUBLIC_KEY != ''
        run: |
          # A release that cannot verify itself must not ship: the built binary
          # computes its own SHA-256 and checks it against the signed
          # SHA256SUMS above, signature before hash.
          ./cau verify-self --from dist --pubkey dist/release-pubkey.hex \
            --name "cau-${{ needs.prepare.outputs.version }}-linux-amd64"

      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          # dist/ in full, the distro packages included: they were staged from
          # the package workflow before signing above, so this one step
          # publishes every asset the signed SHA256SUMS covers.
          files: dist/*
          fail_on_unmatched_files: true
          tag_name: ${{ needs.prepare.outputs.tag }}
          # The notes are the changelog's section for this version, rendered
          # above. GitHub's generator is not used: it does not recognise this
          # changelog's headings, and a release that carries only a link to the
          # comparison tells an operator nothing.
          body_path: ${{ runner.temp }}/release-notes.md
          # A beta or a release candidate is a pre-release; v1.2.0 is not.
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          # The notes are written, so GitHub's own are not needed.
          generate_release_notes: false
          # A beta is published from a branch, so the tag it is named after
          # does not exist yet: it is created here, at this commit.
          target_commitish: ${{ github.sha }}

  update:
    name: pin the released archive in the Arch recipe
    needs: [prepare, publish]
    # Only a tagged release has an archive the Arch recipe can pin. A beta is
    # not the release the recipe builds from.
    if: needs.prepare.outputs.from_tag == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Open the pull request that pins the released archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA256: ${{ needs.publish.outputs.archive_sha256 }}
          BASE: ${{ github.event.repository.default_branch }} # audit:ok the branch name arrives through the environment, never pasted into the script
        run: |
          set -euo pipefail
          pkgbuild=packaging/arch/PKGBUILD
          srcinfo=packaging/arch/.SRCINFO
          branch="release/${VERSION}-arch-pin"
          current=$(grep -oP "^sha256sums=\('\K[0-9a-f]+" "$pkgbuild" || true)
          pkgver=$(bash -c '. packaging/arch/PKGBUILD; printf "%s" "$pkgver"')
          if [ "$pkgver" = "$VERSION" ] && [ "$current" = "$SHA256" ]; then
            echo "the Arch recipe already pins $VERSION"
            exit 0
          fi
          sed -i "s|^pkgver=.*|pkgver=$VERSION|" "$pkgbuild"
          sed -i "s|^sha256sums=.*|sha256sums=('$SHA256')|" "$pkgbuild"
          # The .SRCINFO is the recipe's generated form, and the packaging gate
          # compares it with what makepkg generates: a recipe and its .SRCINFO
          # that disagree fail that gate, so both are updated here.
          sed -i "s|^\tpkgver = .*|\tpkgver = $VERSION|" "$srcinfo"
          sed -i "s|^\tsha256sums = .*|\tsha256sums = $SHA256|" "$srcinfo"
          sed -i "s|^\tsource = .*|\tsource = https://github.com/1ungaka/sentinel-edr/releases/download/v${VERSION}/cau-${VERSION}.tar.gz|" "$srcinfo"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$pkgbuild" "$srcinfo"
          git commit -m "packaging/arch: pin $VERSION's source archive"
          title="packaging/arch: pin $VERSION's source archive"
          # The values are printf's arguments, not the format's: the format is
          # single-quoted on purpose so the shell leaves it alone.
          # shellcheck disable=SC2016
          body=$(printf 'The release %s published the source archive this recipe builds from. The digest below is the one the signed SHA256SUMS of the release carries.\n\n```\nsha256  %s\n```\n' "$VERSION" "$SHA256")
          git push --force origin "HEAD:refs/heads/${branch}"
          # One pull request per release: an open one for the same branch is
          # updated rather than duplicated, so a re-run of the release does not
          # leave two competing pins behind.
          number=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" --title "$title" --body "$body"
          else
            gh pr create --base "$BASE" --head "$branch" --title "$title" --body "$body"
          fi
