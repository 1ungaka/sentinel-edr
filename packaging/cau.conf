# CAU EDR agent configuration.
#
# Installed to /etc/cau/cau.conf. This is the one place a setting can be
# *signed*, which is why the SIEM address belongs here rather than in a command
# line or an environment variable: `cau selftest --record` pins the address into
# the integrity baseline, and from then on editing the line below can neither
# silence the incident stream nor redirect it somewhere else. The daemon notices
# the mismatch, keeps using the pinned address, and raises it as an incident.
#
# After changing anything here, re-record the baseline so the change is the
# trusted one rather than a tamper alert:
#
#   sudo cau selftest --record                      # unsigned
#   sudo cau selftest --record --sign-key priv.hex  # signed; keep the key OFF this host
#
# Precedence is: built-in default, then this file, then the command line. A flag
# you type always wins, so nothing here stops you overriding it for one run.
#
# Keep this file owned by root and not group- or world-writable. The agent
# refuses to read it otherwise, because a file somebody else can rewrite is not
# configuration, it is an input from them.

# ── Where incidents go ──────────────────────────────────────────────────────
# An IP, a hostname, host:port, or a full URL. A bare address means
# https://<address>:55000, the Wazuh Manager API port.
#
#siem      = 10.0.0.5
#siem-user = cau-agent

# The password is never read from here and never from the command line, because
# argv is world-readable in /proc/<pid>/cmdline. It comes from this environment
# variable, which the service unit supplies via EnvironmentFile:
#   /etc/cau/forward.env   ->   WAZUH_PASSWORD=...     (chmod 0600, root-owned)
#siem-password-env = WAZUH_PASSWORD

# Trust only this CA bundle for the manager's certificate.
#siem-ca = /etc/cau/wazuh-ca.pem

# Skip TLS verification. This also permits plain http://. Leave it false unless
# you are testing against a lab manager.
#siem-insecure = false

# ── What the agent does about what it finds ─────────────────────────────────
# These are the defaults, written out so they are visible rather than implied.
# Every one of them acts only on a CONFIRMED incident: live state of the host,
# two independent layers agreeing on one artefact, or known-bad content. One
# layer's opinion is an alert for a human and never triggers any of this.
#
# respond: stop, kill or none. The default freezes the process with its memory
# intact so you can still examine it, and it is reversible. kill is not.
#respond = stop

# Move confirmed files into the integrity-sealed vault, from which they restore.
#quarantine = true

# Ask the kernel guard to refuse confirmed executables. Skipped with a clear log
# line if cau-kernel is not installed.
#block-exe = true

# Drop traffic to and from a confirmed incident's peers, in cau's own nftables
# table or iptables chains. Skipped with a clear log line if the host has
# neither. Loopback, this host's own addresses, its gateways and its resolvers
# are never blocked.
#netblock = true

# Turn the entire response surface off: still detect, still alert, still
# forward, but change nothing on the host. This is the mode to run in for a
# while on a host you do not know yet.
#report-only = false

# ── Detection content ───────────────────────────────────────────────────────
# The threat-intel feed. It is verified against the integrity baseline on every
# reload, so a feed replaced underneath the running daemon is refused and the
# last trustworthy one stays live.
#feed = /var/lib/cau/feed.txt
